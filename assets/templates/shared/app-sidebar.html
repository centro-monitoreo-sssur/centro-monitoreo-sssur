<aside :class="[
    sidebarAbierto ? 'translate-x-0' : '-translate-x-full lg:translate-x-0',
    sidebarColapsado ? 'w-[76px]' : 'w-[250px]'
  ]"
  class="fixed lg:sticky top-0 h-screen shrink-0 z-[9999] flex flex-col text-white transition-all duration-300 shadow-2xl"
  :class="sidebarColapsado ? 'overflow-visible' : 'overflow-hidden'"
  :style="{background:'#0B132B'}">

  <!-- LOGO Y TOGGLE -->
  <div class="px-4 py-4 flex items-center transition-all duration-300"
    :class="sidebarColapsado ? 'justify-center' : 'justify-between'">
    <div class="flex items-center gap-3 overflow-hidden" v-show="!sidebarColapsado">
      <img src="https://sansalvadorsur.gob.sv/images/logo-blanco-horizontal.png" alt="Municipalidad de San Salvador Sur"
        class="h-8 object-contain" @error="logoError=true" v-show="!logoError">
      <div v-show="logoError" class="flex items-center gap-2">
        <i class="fas fa-shield-alt text-[var(--gold)] text-xl shrink-0"></i>
        <span class="font-extrabold tracking-tight leading-tight text-xs">San Salvador<br>Sur</span>
      </div>
    </div>
    <button @click="toggleSidebar"
      class="hidden lg:flex w-8 h-8 shrink-0 items-center justify-center rounded-lg hover:bg-white/10 transition-colors text-white/70 hover:text-white">
      <i class="fas fa-bars text-lg"></i>
    </button>
  </div>

  <!-- TÍTULO SISTEMA -->
  <div
    class="border-b border-white/10 whitespace-nowrap overflow-hidden transition-all duration-300 flex flex-col justify-center"
    :class="sidebarColapsado ? 'h-0 opacity-0 border-transparent' : 'h-[55px] px-5 opacity-100'">
    <p class="text-[9px] tracking-[0.2em] text-white/50 font-bold uppercase">Centro de Monitoreo</p>
    <p class="text-[13px] font-extrabold truncate mt-0.5 tracking-wide text-white">Gestión Integral de Incidentes</p>
  </div>

  <!-- NAVEGACIÓN (Overflow visible para no cortar los tooltips) -->
  <nav class="flex-1 py-4 space-y-1"
    :class="sidebarColapsado ? 'overflow-visible' : 'overflow-y-auto overflow-x-visible'">

    <p class="text-[9px] tracking-[0.2em] text-white/40 font-bold overflow-hidden whitespace-nowrap transition-all duration-300"
      :class="sidebarColapsado ? 'h-0 opacity-0 mb-0' : 'h-[20px] px-5 opacity-100 mb-1 mt-1'">OPERACIÓN</p>

    <div class="px-3" :class="sidebarColapsado ? 'overflow-visible' : ''">
      <button v-for="item in navOperacion" :key="item.id" @click="irA(item.id)"
        class="sidebar-nav-item group relative flex items-center transition-all duration-300 rounded-xl"
        :class="[
          sidebarColapsado ? 'w-10 h-10 justify-center mx-auto' : 'w-full px-3 py-2.5 gap-3',
          vistaActual===item.id ? 'bg-white shadow-lg' : 'hover:bg-white/5'
        ]"
        :id="'nav-btn-' + item.id">

        <i :class="['fas', item.icono, 'text-lg transition-colors shrink-0', vistaActual===item.id ? 'text-blue-600' : 'text-white/70 group-hover:text-white']"></i>

        <span v-show="!sidebarColapsado" class="whitespace-nowrap transition-opacity duration-200 flex-1 text-left text-[13px]"
          :class="[
            vistaActual===item.id ? 'text-slate-900 font-bold' : 'text-white/80 font-medium group-hover:text-white'
          ]">
          {{ item.label }}
        </span>

        <span v-if="item.badge && item.badge() && !sidebarColapsado"
          class="bg-red-500 text-white text-[10px] font-bold rounded-full min-w-[18px] h-[18px] flex items-center justify-center px-1 shadow-sm shrink-0">
          {{ item.badge() }}
        </span>

        <!-- Tooltip (solo en colapsado) -->
        <div v-if="sidebarColapsado"
          class="sidebar-tooltip absolute left-[76px] top-1/2 -translate-y-1/2 px-3 py-1.5 bg-white text-slate-900 text-[13px] font-bold rounded-lg shadow-xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all whitespace-nowrap flex items-center gap-2 border border-slate-100 pointer-events-none"
          style="z-index: 10002;">
          {{ item.label }}
          <span v-if="item.badge && item.badge()" class="bg-red-500 text-white text-[9px] px-1.5 py-0.5 rounded-full">{{
            item.badge() }}</span>
        </div>
      </button>
    </div>

    <div class="my-3 mx-3 border-t border-white/5"></div>

    <p class="text-[9px] tracking-[0.2em] text-white/40 font-bold overflow-hidden whitespace-nowrap transition-all duration-300"
      :class="sidebarColapsado ? 'h-0 opacity-0 mb-0' : 'h-[20px] px-5 opacity-100 mb-1 mt-1'">ADMINISTRACIÓN</p>

    <div class="px-3 pb-2" :class="sidebarColapsado ? 'overflow-visible' : ''">
      <button v-for="item in navAdmin" :key="item.id" @click="irA(item.id)"
        class="sidebar-nav-item group relative flex items-center transition-all duration-300 rounded-xl"
        :class="[
          sidebarColapsado ? 'w-10 h-10 justify-center mx-auto overflow-visible' : 'w-full px-3 py-2.5 gap-3',
          vistaActual===item.id ? 'bg-white shadow-lg' : 'hover:bg-white/5'
        ]">

        <i :class="['fas', item.icono, 'text-lg transition-colors shrink-0', vistaActual===item.id ? 'text-slate-800' : 'text-white/70 group-hover:text-white']"></i>

        <span v-show="!sidebarColapsado" class="whitespace-nowrap transition-opacity duration-200 flex-1 text-left text-[13px]"
          :class="[
            vistaActual===item.id ? 'text-slate-900 font-bold' : 'text-white/80 font-medium group-hover:text-white'
          ]">
          {{ item.label }}
        </span>

        <!-- Tooltip (solo en colapsado) -->
        <div v-if="sidebarColapsado"
          class="sidebar-tooltip absolute left-[76px] top-1/2 -translate-y-1/2 px-3 py-1.5 bg-white text-slate-900 text-[13px] font-bold rounded-lg shadow-xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all whitespace-nowrap border border-slate-100 pointer-events-none"
          style="z-index: 10002;">
          {{ item.label }}
        </div>
      </button>
    </div>
  </nav>

  <!-- USER / FOOTER -->
  <div class="p-3 border-t border-white/10">
    <div
      class="flex items-center rounded-xl bg-[#141d34] hover:bg-[#1a2542] transition-colors cursor-pointer group relative shadow-inner border border-white/5"
      :class="sidebarColapsado ? 'w-10 h-10 justify-center mx-auto' : 'px-3 py-2.5 gap-3'">

      <div
        class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center font-bold text-xs shrink-0 shadow-md">
        RA
      </div>

      <div class="flex-1 min-w-0 overflow-hidden" v-show="!sidebarColapsado">
        <p class="text-[12px] font-bold truncate text-white leading-tight">Admin Sistema</p>
        <p class="text-[9px] text-white/50 truncate flex items-center gap-1 mt-0.5">
          <span class="w-1.5 h-1.5 rounded-full"
            :class="conexionOk ? 'bg-emerald-500 shadow-[0_0_5px_#10b981]' : 'bg-red-500 shadow-[0_0_5px_#ef4444]'"></span>
          {{ conexionOk ? 'En línea' : 'Modo offline' }}
        </p>
      </div>

      <button v-show="!sidebarColapsado"
        @click="abrirModalLogout"
        class="shrink-0 text-white/40 hover:text-white transition-colors p-1.5 rounded-lg hover:bg-white/10"
        title="Cerrar sesión">
        <i class="fas fa-sign-out-alt text-sm"></i>
      </button>

      <!-- Tooltip Perfil (solo en colapsado) -->
      <div v-if="sidebarColapsado"
        class="absolute left-12 top-1/2 -translate-y-1/2 px-3 py-2 bg-white text-slate-900 rounded-lg shadow-xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all z-50 whitespace-nowrap min-w-[140px] pointer-events-none">
        <p class="text-[12px] font-bold">Admin Sistema</p>
        <p class="text-[9px] text-slate-500 flex items-center gap-1.5 mt-1">
          <span class="w-1.5 h-1.5 rounded-full" :class="conexionOk ? 'bg-emerald-500' : 'bg-red-500'"></span>
          {{ conexionOk ? 'Conectado a Supabase' : 'Modo offline' }}
        </p>
      </div>
    </div>
  </div>
</aside>

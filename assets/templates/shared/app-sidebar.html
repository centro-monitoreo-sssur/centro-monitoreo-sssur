<!-- ============================================================
     BARRA LATERAL · estructura de TailAdmin, identidad municipal
     ------------------------------------------------------------
     Fondo claro, ítem activo como píldora de tinte suave, títulos de grupo en
     versalitas grises y colapsado a 90 px que se despliega al pasar el ratón.
     El azul institucional deja de ser el lienzo y pasa a ser el acento.

     El <aside> solo pone el ancho en el flujo; todo lo visible vive en
     `.barra-lateral__panel`, que es lo que crece al pasar el ratón sin
     recolocar la página. Ver el porqué en assets/css/tailwind-fuente.css.
     ============================================================ -->
<aside :class="[
    sidebarAbierto ? 'translate-x-0' : '-translate-x-full lg:translate-x-0',
    sidebarColapsado ? 'w-[290px] lg:w-[90px] barra-lateral--estrecha' : 'w-[290px]'
  ]"
  class="barra-lateral fixed lg:sticky top-0 h-screen shrink-0 z-[9999]
         border-r border-gray-200 bg-white transition-all duration-300
         dark:border-gray-800 dark:bg-gray-900">

  <div class="barra-lateral__panel">

    <!-- ── Cabecera: logotipo y colapso ───────────────────────────────── -->
    <div class="flex h-[72px] shrink-0 items-center gap-2 px-5"
         :class="sidebarColapsado ? 'lg:justify-center' : 'justify-between'">

      <div class="solo-ancho--flex flex items-center gap-3 overflow-hidden">
        <img src="/assets/img/marca/logo-azul-horizontal.png"
             alt="Municipalidad de San Salvador Sur"
             class="h-9 object-contain dark:hidden"
             @error="logoError=true" v-show="!logoError">
        <img src="/assets/img/marca/logo-blanco-horizontal.png"
             alt="Municipalidad de San Salvador Sur"
             class="hidden h-9 object-contain dark:block"
             v-show="!logoError">
        <div v-show="logoError" class="flex items-center gap-2">
          <i class="fas fa-shield-alt text-xl text-brand-600 dark:text-brand-300"></i>
          <span class="text-xs font-extrabold leading-tight tracking-tight text-gray-900 dark:text-white">
            San Salvador<br>Sur
          </span>
        </div>
      </div>

      <!-- Marca reducida cuando el menú está estrecho -->
      <div class="solo-estrecho">
        <span class="grid h-9 w-9 place-items-center rounded-xl bg-brand-600 text-sm font-black text-white">
          SS
        </span>
      </div>

      <button @click="toggleSidebar" type="button"
        :aria-label="sidebarColapsado ? 'Expandir menú lateral' : 'Colapsar menú lateral'"
        :aria-expanded="sidebarColapsado ? 'false' : 'true'"
        class="solo-ancho--grid toque-comodo hidden h-9 w-9 shrink-0 lg:grid place-items-center rounded-lg
               text-gray-500 transition-colors hover:bg-gray-100 hover:text-gray-700
               dark:text-gray-400 dark:hover:bg-white/5 dark:hover:text-white">
        <i class="fas fa-bars" aria-hidden="true"></i>
      </button>
    </div>

    <!-- Nombre del sistema. Desaparece al colapsar: a 90 px no cabe, y
         partirlo en dos líneas ilegibles no informa de nada. -->
    <div class="solo-ancho border-b border-gray-100 px-5 pb-4 dark:border-gray-800">
      <p class="text-[10px] font-bold uppercase tracking-[0.18em] text-gray-400">Centro de Monitoreo</p>
      <p class="mt-0.5 truncate text-[13px] font-bold text-gray-800 dark:text-gray-100">
        Gestión Integral de Incidentes
      </p>
    </div>

    <!-- ── Navegación ─────────────────────────────────────────────────── -->
    <nav class="sin-scrollbar flex-1 overflow-y-auto px-4 py-5">

      <div v-for="grupo in gruposVisibles" :key="grupo.id" class="mb-6 last:mb-0">

        <!-- Título del grupo. Al colapsar se sustituye por los tres puntos de
             TailAdmin: mantiene la separación visual entre bloques sin
             pretender que un texto de once píxeles se lea a 90 px de ancho. -->
        <h3 class="menu-grupo-titulo solo-ancho">{{ grupo.label }}</h3>
        <p class="solo-estrecho mb-3 text-center text-gray-300 dark:text-gray-600" aria-hidden="true">
          <i class="fas fa-ellipsis text-xs"></i>
        </p>

        <ul class="flex flex-col gap-1">
          <li v-for="item in grupo.items" :key="item.id">
            <button type="button" @click="irA(item.id)"
              :id="'nav-btn-' + item.id"
              :title="item.label"
              :aria-current="vistaActual===item.id ? 'page' : null"
              class="menu-item"
              :class="vistaActual===item.id ? 'menu-item--activo' : 'menu-item--inactivo'">

              <i :class="['fas', item.icono, 'menu-item__icono']" aria-hidden="true"></i>

              <span class="solo-ancho flex-1 text-left whitespace-nowrap">{{ item.label }}</span>

              <!-- Con el menú ancho, el número. Estrecho, un punto: el número
                   no cabe junto al icono y recortado engaña más que informa. -->
              <span v-if="item.badge && item.badge()" class="menu-badge solo-ancho">
                {{ item.badge() }}
              </span>
              <span v-if="item.badge && item.badge()"
                class="solo-estrecho absolute right-2 top-2 h-2 w-2 rounded-full bg-rose-500"></span>
            </button>
          </li>
        </ul>
      </div>

      <!-- Si los permisos dejaran el menú vacío, decirlo. En blanco parecería
           que la aplicación no terminó de cargar. -->
      <p v-if="!gruposVisibles.length"
         class="solo-ancho px-3 py-6 text-[11px] leading-relaxed text-gray-400">
        Tu rol no tiene módulos asignados. Contacta al administrador del sistema.
      </p>
    </nav>

    <!-- ── Ficha de la persona ────────────────────────────────────────── -->
    <div class="shrink-0 border-t border-gray-100 p-4 dark:border-gray-800">
      <div class="flex items-center gap-3 rounded-xl px-2 py-2 transition-colors
                  hover:bg-gray-50 dark:hover:bg-white/5"
           :class="sidebarColapsado ? 'lg:justify-center lg:px-0' : ''">

        <span class="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-brand-600 text-xs font-bold text-white">
          {{ iniciales }}
        </span>

        <div class="solo-ancho min-w-0 flex-1">
          <p class="truncate text-[13px] font-semibold leading-tight text-gray-800 dark:text-gray-100">
            {{ nombreMostrado }}
          </p>
          <p class="mt-0.5 flex items-center gap-1.5 text-[10px] text-gray-500 dark:text-gray-400">
            <span class="h-1.5 w-1.5 shrink-0 rounded-full"
                  :class="conexionOk ? 'bg-emerald-500' : 'bg-rose-500'"></span>
            <span class="truncate">{{ rolUsuario || (conexionOk ? 'En línea' : 'Modo offline') }}</span>
          </p>
        </div>

        <button @click="abrirModalLogout" type="button" title="Cerrar sesión"
          class="solo-ancho toque-comodo shrink-0 rounded-lg p-2 text-gray-400 transition-colors
                 hover:bg-gray-100 hover:text-gray-700
                 dark:hover:bg-white/5 dark:hover:text-white">
          <i class="fas fa-sign-out-alt text-sm" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </div>
</aside>

<!-- Comunicados de la PWA de campo.
     El componente estaba registrado en components/index.js desde hace tiempo,
     pero SIN esta rama y sin nadie que navegara a él: una ruta huérfana, así
     que para el empleado la pantalla no existía.

     Es el mismo fallo que ya arrastraba la vista de notificaciones del panel
     —ver el comentario más abajo—: el enrutador es una cadena explícita de
     `v-else-if`, así que registrar un componente NO basta para poder llegar a
     él. Quien añada una vista tiene que tocar los tres sitios: index.js, esta
     cadena, y algo que navegue. -->
<div v-else-if="vistaActual === 'notificaciones-empleado'" class="min-h-screen">
  <vista-notificaciones-empleado></vista-notificaciones-empleado>
</div>

<div v-else-if="vistaActual === 'mapa-vivo'" class="min-h-screen">
  <vista-mapa-vivo></vista-mapa-vivo>
</div>

<div v-else-if="vistaActual === 'noticias'" class="min-h-screen">
  <vista-noticias></vista-noticias>
</div>



<!-- Shell principal (se muestra cuando está autenticado en modo admin) -->
<div v-else class="h-screen overflow-hidden flex">

  <!-- OVERLAY MÓVIL (cierra el sidebar al tocar fuera) — Mobile First -->
  <div v-if="sidebarAbierto && !ocultarShell" @click="sidebarAbierto=false"
       class="fixed inset-0 bg-black/40 z-30 lg:hidden"></div>

  <!-- SIDEBAR -->
  <app-sidebar v-show="!ocultarShell"></app-sidebar>

  <!-- COLUMNA PRINCIPAL -->
  <div class="flex-1 min-w-0 flex flex-col overflow-hidden">

    <!-- TOPBAR -->
    <app-topbar v-show="!ocultarShell"></app-topbar>

    <!-- `overflow-hidden` estaba TAMBIÉN en la clase base, así que las vistas
         que debían scrollear recibían las dos utilidades sobre el mismo
         elemento y ganaba la que el CDN de Tailwind hubiera emitido después
         — no determinista. Es la razón de que Configuración no scrollease.
         Las vistas con lienzo propio (mapa, cartograma, reportes) gestionan su
         scroll internamente; el resto lo delega en <main>. -->
    <main :class="['flex-1 w-full mx-auto min-h-0', vistaActual === 'mapa' || vistaActual === 'cartograma' || vistaActual === 'reportes' ? 'overflow-hidden' : 'overflow-y-auto overflow-x-hidden px-4 lg:px-8 py-6 max-w-[1600px]']">
      <vista-dashboard v-if="vistaActual==='dashboard'"></vista-dashboard>
      <vista-mapa v-else-if="vistaActual==='mapa'"></vista-mapa>
      <vista-cartograma v-else-if="vistaActual==='cartograma'"></vista-cartograma>
      <vista-reportes v-else-if="vistaActual==='reportes'"></vista-reportes>
      <vista-denuncias v-else-if="vistaActual==='denuncias'"></vista-denuncias>
      <vista-intervenciones v-else-if="vistaActual==='intervenciones'"></vista-intervenciones>
      <vista-usuarios v-else-if="vistaActual==='usuarios'"></vista-usuarios>
      <vista-poblacion v-else-if="vistaActual==='poblacion'"></vista-poblacion>
      <vista-departamentos v-else-if="vistaActual==='departamentos'"></vista-departamentos>
      <vista-cuadrillas v-else-if="vistaActual==='cuadrillas'"></vista-cuadrillas>
      <vista-catalogo v-else-if="vistaActual==='catalogo'"></vista-catalogo>
      <vista-roles v-else-if="vistaActual==='roles'"></vista-roles>
      <vista-configuracion v-else-if="vistaActual==='config'"></vista-configuracion>
      <!-- El id del ítem de menú es 'vista-notificaciones' (ver `gruposNav` en
           stores/navegacion.js) y aquí solo se comparaba contra 'notificaciones':
           ninguna rama casaba y la vista caía en `vista-placeholder`. Por eso el
           módulo mostraba "queda como siguiente iteración del backlog" aunque el
           componente existiera. Se aceptan ambos valores porque 'notificaciones'
           sigue estando en enlaces antiguos guardados en localStorage. -->
      <vista-notificaciones v-else-if="vistaActual==='vista-notificaciones' || vistaActual==='notificaciones'"></vista-notificaciones>
      <vista-comunicados v-else-if="vistaActual==='vista-comunicados'"></vista-comunicados>
      <vista-bitacora v-else-if="vistaActual==='bitacora'"></vista-bitacora>
      <vista-placeholder v-else :titulo="tituloVista"></vista-placeholder>
    </main>

    <footer v-show="!ocultarShell && vistaActual !== 'mapa' && vistaActual !== 'cartograma'" class="text-center text-[11px] text-gray-400 py-4">
      Municipalidad de San Salvador Sur — Centro de Operaciones Integrado
    </footer>
  </div>
</div>

<!-- Aviso interno a pantalla completa. Va aquí, fuera de la cadena de
     vistas, porque debe aparecer sin importar qué pantalla esté abierta.
     El propio componente decide si hay algo que mostrar. -->
<modal-comunicado-interno></modal-comunicado-interno>

<!-- Modal de Confirmación (global, fuera del sidebar) -->
<modal-confirmacion 
  v-if="mostrarModalLogout"
  :mostrar="mostrarModalLogout"
  titulo="Cerrar Sesión"
  mensaje="¿Estás seguro de que deseas cerrar tu sesión? Tendrás que volver a ingresar tus credenciales."
  textoConfirmar="Cerrar Sesión"
  @cerrar="mostrarModalLogout = false"
  @confirmar="confirmarLogout">
</modal-confirmacion>

<!-- Modal Nativo de Instalación PWA (Solo Móvil / No Standalone) -->
<transition name="fade">
  <div v-if="mostrarModalInstalacion" class="fixed inset-0 z-[100] flex items-end sm:items-center justify-center bg-gray-900/40 backdrop-blur-sm sm:hidden p-4">
    <div class="bg-white rounded-3xl w-full max-w-sm overflow-hidden shadow-2xl transform transition-all relative mt-auto">
      <div class="bg-emerald-600 p-6 flex flex-col items-center relative overflow-hidden">
        <!-- Decoración -->
        <div class="absolute -top-10 -right-10 w-32 h-32 bg-white/10 rounded-full blur-2xl"></div>
        <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-black/10 rounded-full blur-2xl"></div>
        
        <div class="w-16 h-16 bg-white rounded-2xl shadow-lg flex items-center justify-center mb-4 relative z-10 p-2">
          <img src="https://sansalvadorsur.gob.sv/images/logo-circulo-blanco.png" alt="Logo" class="w-full h-full object-contain">
        </div>
        <h3 class="text-xl font-bold text-white relative z-10 text-center">Instalar Aplicación</h3>
        <p class="text-emerald-50 text-sm mt-1 font-medium text-center relative z-10">Acceso rápido y modo offline</p>
      </div>
      
      <div class="p-6 bg-white space-y-4">
        <div class="space-y-3">
          <div class="flex items-start gap-3">
            <div class="w-8 h-8 rounded-full bg-emerald-50 flex items-center justify-center text-emerald-600 shrink-0 mt-0.5"><i class="fa-solid fa-bolt text-xs"></i></div>
            <div>
              <p class="text-sm font-bold text-gray-900">Más rápido</p>
              <p class="text-xs text-gray-500">Carga instantánea en todo momento.</p>
            </div>
          </div>
          <div class="flex items-start gap-3">
            <div class="w-8 h-8 rounded-full bg-blue-50 flex items-center justify-center text-blue-600 shrink-0 mt-0.5"><i class="fa-solid fa-wifi-slash text-xs"></i></div>
            <div>
              <p class="text-sm font-bold text-gray-900">Modo Offline</p>
              <p class="text-xs text-gray-500">Funciona sin conexión a internet.</p>
            </div>
          </div>
        </div>
        
        <div class="pt-2 flex flex-col gap-2">
          <button @click="instalarPWA" class="w-full py-3.5 bg-gray-900 hover:bg-black text-white font-bold rounded-2xl shadow-lg shadow-gray-900/20 active:scale-95 transition-all text-sm flex items-center justify-center gap-2">
            <i class="fa-solid fa-download"></i>
            Instalar App
          </button>
          <button @click="posponerInstalacion" class="w-full py-3 bg-gray-50 hover:bg-gray-100 text-gray-600 font-bold rounded-2xl active:scale-95 transition-all text-sm">
            En otro momento
          </button>
        </div>
      </div>
    </div>
  </div>
</transition>

<label :for="id" class="flex cursor-pointer items-start gap-3"
       :class="deshabilitado ? 'cursor-not-allowed opacity-50' : ''">
  <input
    :id="id"
    type="checkbox"
    :checked="modelValue"
    :disabled="deshabilitado"
    class="mt-0.5 h-5 w-5 shrink-0 cursor-pointer rounded border-gray-300 accent-brand-600 focus:outline-none focus:ring-3 focus:ring-brand-500/10 disabled:cursor-not-allowed"
    @change="$emit('update:modelValue', $event.target.checked)">
  <span v-if="etiqueta || descripcion" class="min-w-0 select-none">
    <span v-if="etiqueta" class="block text-sm font-medium text-gray-800 dark:text-white/90">{{ etiqueta }}</span>
    <span v-if="descripcion" class="mt-0.5 block text-theme-xs text-gray-500 dark:text-gray-400">{{ descripcion }}</span>
  </span>
</label>

<div class="flex min-h-0 flex-1 flex-col overflow-hidden rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/[0.03]">

  <!-- Barra de acciones en lote: solo aparece cuando hay selección, para no
       robar espacio vertical el resto del tiempo. -->
  <div v-if="seleccionables && seleccion.length"
       class="flex items-center justify-between gap-3 border-b border-gray-200 bg-brand-50 px-5 py-2.5 dark:border-gray-800 dark:bg-brand-500/[0.12]">
    <span class="text-xs font-medium text-brand-600 dark:text-brand-300">
      {{ seleccion.length }} seleccionado(s)
    </span>
    <div class="flex items-center gap-2">
      <slot name="acciones-lote" :seleccion="seleccion"></slot>
    </div>
  </div>

  <div class="overflow-x-auto flex-1 min-h-0 overflow-y-auto">
    <table class="w-full text-left border-collapse" :style="{ minWidth: anchoMinimo }">
      <thead>
        <!-- `sticky` sobre <th>: en <thead> no funciona en todos los navegadores
             con border-collapse. -->
        <tr class="border-b border-gray-200 dark:border-gray-800">
          <th v-if="seleccionables"
              class="sticky top-0 z-10 w-10 border-b border-gray-200 bg-white dark:border-gray-800 dark:bg-gray-900"
              :class="clasesCelda">
            <input type="checkbox" aria-label="Seleccionar todas las filas visibles"
                   class="rounded border-gray-300 text-brand-600 focus:ring-brand-500"
                   :checked="todasSeleccionadas"
                   :indeterminate.prop="algunaSeleccionada"
                   @change="alternarTodas">
          </th>

          <th v-for="col in columnas" :key="col.clave"
              scope="col"
              class="sticky top-0 z-10 border-b border-gray-200 bg-white text-xs font-medium text-gray-500 dark:border-gray-800 dark:bg-gray-900 dark:text-gray-400"
              :class="[clasesCelda, alineacion(col), col.ordenable ? 'cursor-pointer select-none hover:text-gray-800 dark:hover:text-gray-200' : '']"
              :style="col.ancho ? { width: col.ancho } : null"
              :aria-sort="ordenPor === col.clave ? (ordenAsc ? 'ascending' : 'descending') : (col.ordenable ? 'none' : null)"
              @click="ordenarPor(col)">
            <span class="inline-flex items-center gap-1.5">
              {{ col.titulo }}
              <i v-if="col.ordenable"
                 class="fa-solid text-[9px]"
                 :class="ordenPor === col.clave
                   ? (ordenAsc ? 'fa-arrow-up-short-wide text-brand-600' : 'fa-arrow-down-wide-short text-brand-600')
                   : 'fa-sort opacity-30'"
                 aria-hidden="true"></i>
            </span>
          </th>
        </tr>
      </thead>

      <tbody class="divide-y divide-gray-100 dark:divide-gray-800">
        <!-- Carga: mismo número de columnas y alto de fila que el contenido real.
             `v-if` y `v-for` van en elementos distintos a propósito: en Vue 3
             el `v-if` se evalúa antes que el `v-for` y ponerlos juntos es un
             error de compilación además de un aviso en consola. -->
        <template v-if="cargando">
          <tr v-for="n in filasSkeleton" :key="'sk-' + n">
            <td v-if="seleccionables" :class="clasesCelda"><span class="skeleton block h-4 w-4 rounded"></span></td>
            <td v-for="col in columnas" :key="'sk-' + n + col.clave" :class="clasesCelda">
              <span class="skeleton block h-4 rounded" :style="{ width: (40 + (n * 7 + col.clave.length * 3) % 50) + '%' }"></span>
            </td>
          </tr>
        </template>

        <template v-else>
          <tr v-for="fila in filasOrdenadas" :key="fila[claveFila]"
              class="transition-colors hover:bg-gray-50 dark:hover:bg-gray-750"
              :class="estaSeleccionada(fila) ? 'bg-brand-50/60 dark:bg-brand-900/20' : ''"
              @click="$emit('fila-click', fila)">
            <td v-if="seleccionables" :class="clasesCelda" @click.stop>
              <input type="checkbox"
                     :aria-label="'Seleccionar fila ' + fila[claveFila]"
                     class="rounded border-gray-300 text-brand-600 focus:ring-brand-500"
                     :checked="estaSeleccionada(fila)"
                     @change="alternarFila(fila)">
            </td>

            <td v-for="col in columnas" :key="col.clave"
                :class="[clasesCelda, alineacion(col), col.mono ? 'font-mono text-xs' : 'text-xs',
                         'text-gray-600 dark:text-gray-300']">
              <!-- Slot por columna: `#celda-estado`, `#celda-categoria`… Si la
                   vista no lo define, se pinta el valor crudo. -->
              <slot :name="'celda-' + col.clave" :fila="fila" :valor="fila[col.clave]">
                {{ fila[col.clave] }}
              </slot>
            </td>
          </tr>

          <tr v-if="!filasOrdenadas.length">
            <td :colspan="columnas.length + (seleccionables ? 1 : 0)" class="px-5 py-12 text-center text-gray-400">
              <i :class="vacioIcono" class="text-3xl mb-3 block" aria-hidden="true"></i>
              <p class="text-sm">{{ vacioTexto }}</p>
              <div class="mt-3"><slot name="vacio-accion"></slot></div>
            </td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>

  <!-- Pie de paginación -->
  <div v-if="totalItems > 0"
       class="px-5 py-3 border-t border-gray-100 dark:border-gray-700 bg-gray-50/60 dark:bg-gray-900/40 flex flex-wrap items-center justify-between gap-3">
    <div class="flex items-center gap-4">
      <div class="text-xs text-gray-500 dark:text-gray-400">
        <span class="font-bold font-mono">{{ rangoMostrado.desde }}</span>–<span class="font-bold font-mono">{{ rangoMostrado.hasta }}</span>
        de <span class="font-bold font-mono">{{ totalItems }}</span>
      </div>
      <select :value="itemsPorPagina"
              aria-label="Registros por página"
              class="text-xs border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 dark:text-white rounded-lg px-2 py-1 focus:ring-2 focus:ring-brand-500 focus:outline-none"
              @change="$emit('cambiar-tamano', parseInt($event.target.value))">
        <option v-for="t in tamanosPagina" :key="t" :value="t">{{ t }}</option>
      </select>
    </div>

    <nav class="flex gap-1" aria-label="Paginación">
      <button type="button" aria-label="Página anterior"
              class="toque-comodo w-8 h-8 rounded-lg flex items-center justify-center text-gray-500 hover:bg-gray-200 dark:hover:bg-gray-700 disabled:opacity-40 disabled:cursor-not-allowed transition-colors"
              :disabled="paginaActual === 1" @click="irAPagina(paginaActual - 1)">
        <i class="fa-solid fa-chevron-left text-[10px]" aria-hidden="true"></i>
      </button>

      <template v-for="(p, i) in paginasVisibles" :key="'p' + i">
        <span v-if="p === '…'" class="w-8 h-8 flex items-center justify-center text-gray-400 text-xs">…</span>
        <button v-else type="button"
                class="w-8 h-8 rounded-lg flex items-center justify-center text-xs font-semibold transition-colors"
                :class="p === paginaActual
                  ? 'bg-brand-600 text-white'
                  : 'text-gray-600 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-700'"
                :aria-current="p === paginaActual ? 'page' : null"
                @click="irAPagina(p)">{{ p }}</button>
      </template>

      <button type="button" aria-label="Página siguiente"
              class="toque-comodo w-8 h-8 rounded-lg flex items-center justify-center text-gray-500 hover:bg-gray-200 dark:hover:bg-gray-700 disabled:opacity-40 disabled:cursor-not-allowed transition-colors"
              :disabled="paginaActual === paginasTotales" @click="irAPagina(paginaActual + 1)">
        <i class="fa-solid fa-chevron-right text-[10px]" aria-hidden="true"></i>
      </button>
    </nav>
  </div>
</div>

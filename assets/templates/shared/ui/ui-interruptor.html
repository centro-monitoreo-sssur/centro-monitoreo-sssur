<div class="flex items-start justify-between gap-4">
  <div v-if="etiqueta || descripcion" class="min-w-0">
    <p v-if="etiqueta" class="text-sm font-medium text-gray-800 dark:text-white/90">{{ etiqueta }}</p>
    <p v-if="descripcion" class="mt-0.5 text-theme-xs text-gray-500 dark:text-gray-400">{{ descripcion }}</p>
  </div>

  <!-- El área pulsable mide 44x28: el óvalo visual es más pequeño pero el
       relleno del botón completa el objetivo táctil. -->
  <button type="button" role="switch"
          :aria-checked="modelValue ? 'true' : 'false'"
          :aria-label="etiqueta || 'Interruptor'"
          :disabled="deshabilitado"
          class="relative h-7 w-12 shrink-0 rounded-full p-0.5 transition-colors focus:outline-none focus:ring-3 focus:ring-brand-500/10 disabled:cursor-not-allowed disabled:opacity-40"
          :class="modelValue ? 'bg-brand-600' : 'bg-gray-200 dark:bg-white/10'"
          @click="alternar">
    <span class="block h-6 w-6 rounded-full bg-white shadow-theme-xs transition-transform"
          :class="modelValue ? 'translate-x-5' : 'translate-x-0'"></span>
  </button>
</div>

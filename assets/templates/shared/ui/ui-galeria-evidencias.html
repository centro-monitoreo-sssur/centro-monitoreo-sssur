<div v-if="visible" class="space-y-2">

  <div class="flex items-center justify-between">
    <h4 class="text-[11px] font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400">
      {{ titulo }}
      <span v-if="adjuntos.length" class="ml-1 font-mono text-gray-400 dark:text-gray-500">
        ({{ adjuntos.length }})
      </span>
    </h4>
    <button v-if="error" type="button" @click="recargar"
            class="text-xs font-semibold text-blue-600 dark:text-blue-400 hover:underline">
      Reintentar
    </button>
  </div>

  <!-- Cargando: se reserva el sitio que van a ocupar las miniaturas para que
       el modal no dé un salto cuando lleguen. -->
  <div v-if="cargando" class="flex gap-2" aria-live="polite">
    <div v-for="n in 2" :key="n"
         :class="compacta ? 'h-20 w-20' : 'h-24 w-24'"
         class="animate-pulse rounded-xl bg-gray-200 dark:bg-gray-700"></div>
  </div>

  <p v-else-if="error"
     class="rounded-lg bg-red-50 dark:bg-red-900/20 px-3 py-2 text-xs text-red-700 dark:text-red-300">
    {{ error }}
  </p>

  <p v-else-if="vacia"
     class="rounded-lg bg-gray-50 dark:bg-gray-800/60 px-3 py-2 text-xs text-gray-500 dark:text-gray-400">
    <i class="fa-regular fa-image mr-1.5"></i>
    Sin fotografías adjuntas.
  </p>

  <template v-else>
    <div v-for="grupo in [
           { clave: 'reporte', rotulo: 'Al reportar', fotos: deReporte },
           { clave: 'cierre',  rotulo: 'Al cerrar',   fotos: deCierre }
         ]"
         :key="grupo.clave">
      <template v-if="grupo.fotos.length">
        <p v-if="hayDosGrupos"
           class="mt-2 mb-1 text-[10px] font-semibold uppercase tracking-wide text-gray-400 dark:text-gray-500">
          {{ grupo.rotulo }}
        </p>

        <div class="flex flex-wrap gap-2">
          <button v-for="foto in grupo.fotos" :key="foto.id" type="button"
                  @click="abrirVisor(foto)"
                  :title="foto.nombre + ' · ' + fechaLegible(foto.fecha)"
                  :class="compacta ? 'h-20 w-20' : 'h-24 w-24'"
                  class="group relative overflow-hidden rounded-xl border border-gray-200 dark:border-gray-700
                         bg-gray-100 dark:bg-gray-800 transition
                         hover:border-blue-400 hover:shadow-md
                         focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500">

            <!-- Una imagen que no carga se dice; el hueco roto del navegador
                 se parece demasiado a «no hay foto». -->
            <span v-if="estaRota(foto)"
                  class="flex h-full w-full flex-col items-center justify-center gap-1 px-1 text-center">
              <i class="fa-solid fa-triangle-exclamation text-amber-500"></i>
              <span class="text-[9px] leading-tight text-gray-500 dark:text-gray-400">No se pudo cargar</span>
            </span>

            <img v-else :src="foto.url" :alt="'Fotografía del caso: ' + foto.nombre"
                 loading="lazy" decoding="async"
                 @error="alFallarImagen(foto)"
                 class="h-full w-full object-cover transition duration-200 group-hover:scale-105">

            <span class="pointer-events-none absolute inset-x-0 bottom-0 flex items-center justify-center
                         bg-black/45 py-0.5 opacity-0 transition group-hover:opacity-100">
              <i class="fa-solid fa-magnifying-glass-plus text-[10px] text-white"></i>
            </span>
          </button>
        </div>
      </template>
    </div>
  </template>

  <!-- ── Visor ──────────────────────────────────────────────────────────────
       Por encima de TODO modal que pueda contenerlo, o se abriría por detrás y
       parecería que el clic no hace nada. El techo lo marca el modal del Mapa
       en Vivo, que usa z-[10050]. -->
  <teleport to="body">
    <div v-if="fotoActual"
         class="fixed inset-0 z-[10060] flex flex-col bg-black/90 backdrop-blur-sm"
         role="dialog" aria-modal="true" aria-label="Visor de fotografía"
         @click.self="cerrarVisor">

      <div class="flex items-center justify-between gap-3 px-4 py-3 text-white">
        <div class="min-w-0">
          <p class="truncate text-sm font-semibold">{{ fotoActual.nombre }}</p>
          <p class="text-xs text-white/60">
            {{ fechaLegible(fotoActual.fecha) }}
            <span v-if="tamanoLegible(fotoActual.tamano)"> · {{ tamanoLegible(fotoActual.tamano) }}</span>
            <span v-if="adjuntos.length > 1"> · {{ indiceVisor + 1 }} de {{ adjuntos.length }}</span>
          </p>
        </div>
        <div class="flex shrink-0 items-center gap-1">
          <a :href="fotoActual.url" target="_blank" rel="noopener noreferrer"
             title="Abrir en una pestaña nueva"
             class="grid h-9 w-9 place-items-center rounded-full text-white/80 hover:bg-white/10 hover:text-white">
            <i class="fa-solid fa-arrow-up-right-from-square text-sm"></i>
          </a>
          <button type="button" @click="cerrarVisor" title="Cerrar (Esc)"
                  class="grid h-9 w-9 place-items-center rounded-full text-white/80 hover:bg-white/10 hover:text-white">
            <i class="fa-solid fa-xmark text-lg"></i>
          </button>
        </div>
      </div>

      <div class="relative flex min-h-0 flex-1 items-center justify-center px-4 pb-4"
           @click.self="cerrarVisor">
        <button v-if="adjuntos.length > 1" type="button" @click.stop="mover(-1)"
                title="Anterior (←)"
                class="absolute left-2 grid h-11 w-11 place-items-center rounded-full bg-black/40
                       text-white/90 hover:bg-black/70">
          <i class="fa-solid fa-chevron-left"></i>
        </button>

        <img :src="fotoActual.url" :alt="'Fotografía del caso: ' + fotoActual.nombre"
             class="max-h-full max-w-full rounded-lg object-contain shadow-2xl">

        <button v-if="adjuntos.length > 1" type="button" @click.stop="mover(1)"
                title="Siguiente (→)"
                class="absolute right-2 grid h-11 w-11 place-items-center rounded-full bg-black/40
                       text-white/90 hover:bg-black/70">
          <i class="fa-solid fa-chevron-right"></i>
        </button>
      </div>
    </div>
  </teleport>
</div>

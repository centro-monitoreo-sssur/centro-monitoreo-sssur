<!-- ============================================================
     VISTA: PWA Principal para Empleados (Estilo iOS Mobile)
     Centro de Monitoreo SSSur · App de Campo
     ============================================================ -->
<div class="min-h-screen bg-gray-100 overflow-x-hidden pb-[calc(env(safe-area-inset-bottom)+7.5rem)]">
  <!-- iOS Status Bar Simulation -->
  <div class="bg-white/80 backdrop-blur-lg border-b border-gray-200/50 sticky top-0 z-50">
    <div class="px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <img src="https://sansalvadorsur.gob.sv/images/logo-azul-horizontal.png" alt="Logo Municipalidad"
          class="h-8 w-auto">
        <div>
          <h1 class="text-lg font-semibold text-gray-900">Sistema Municipal</h1>
          <p class="text-xs text-gray-500">Módulo de empleado</p>
          <!-- <p class="text-xs text-gray-500">{{ rolDisplay }}</p> -->
        </div>
      </div>
      <button @click="cerrarSesion" class="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center">
        <i class="fa-solid fa-sign-out-alt text-gray-600 text-sm"></i>
      </button>
    </div>
  </div>

  <!-- Content -->
  <div class="px-4 py-6 space-y-6">
    <!-- Welcome Card -->
    <div
      class="bg-gradient-to-br from-green-500 via-green-600 to-green-700 rounded-3xl p-6 shadow-2xl shadow-green-500/30">
      <!-- `min-w-0` + `break-words` son obligatorios: sin ellos un valor largo
           sin espacios (un correo, un nombre de zona) desborda la tarjeta y
           mete a TODA la página en scroll horizontal, lo que a su vez corta la
           barra de navegación inferior. -->
      <div class="flex items-start justify-between gap-3 mb-4">
        <div class="min-w-0 flex-1">
          <h2 class="text-white text-2xl font-bold break-words">Hola, {{ usuarioNombre }}</h2>
          <p class="text-green-100 text-sm mt-1 break-words">{{ areaDisplay }}</p>
        </div>
        <div class="w-14 h-14 shrink-0 bg-white/20 rounded-2xl flex items-center justify-center backdrop-blur-sm">
          <i class="fa-solid fa-user-tie text-white text-2xl"></i>
        </div>
      </div>
      <div class="bg-white/20 rounded-2xl p-4 backdrop-blur-sm">
        <div class="flex items-center justify-between gap-3">
          <div class="flex items-center gap-3 min-w-0">
            <div class="w-10 h-10 shrink-0 bg-white/30 rounded-xl flex items-center justify-center">
              <i class="fa-solid fa-map-marker-alt text-white text-lg"></i>
            </div>
            <span class="text-white text-base font-medium truncate">{{ zonaAsignada }}</span>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            <span class="bg-red-500 text-white text-xs font-bold px-3 py-1.5 rounded-full">{{ tareasPendientes }}</span>
            <span class="text-white text-xs font-medium">pendientes</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="space-y-4">
      <h3 class="text-sm font-bold text-gray-500 uppercase tracking-wider">Tareas de Campo</h3>

      <!-- Mis Intervenciones -->
      <button @click="irA('mis-intervenciones')"
        class="w-full bg-white rounded-3xl p-5 shadow-lg shadow-gray-200/50 border border-gray-100 flex items-center space-x-4 active:scale-95 transition-all duration-300 hover:shadow-xl">
        <div class="w-14 h-14 shrink-0 bg-blue-100 rounded-2xl flex items-center justify-center">
          <i class="fa-solid fa-clipboard-check text-blue-600 text-2xl"></i>
        </div>
        <div class="flex-1 min-w-0 text-left">
          <h4 class="font-bold text-gray-900 text-base truncate">Mis Intervenciones</h4>
          <p class="text-sm text-gray-500 truncate">Tareas asignadas</p>
        </div>
        <div class="bg-red-100 text-red-600 text-xs font-bold px-3 py-1.5 rounded-full">
          {{ tareasPendientes }}
        </div>
        <i class="fa-solid fa-chevron-right text-gray-400 text-xl"></i>
      </button>

      <!-- Levantar Denuncia -->
      <button @click="irA('levantar-denuncia')"
        class="w-full bg-white rounded-3xl p-5 shadow-lg shadow-gray-200/50 border border-gray-100 flex items-center space-x-4 active:scale-95 transition-all duration-300 hover:shadow-xl">
        <div class="w-14 h-14 shrink-0 bg-green-100 rounded-2xl flex items-center justify-center">
          <i class="fa-solid fa-plus-circle text-green-600 text-2xl"></i>
        </div>
        <div class="flex-1 min-w-0 text-left">
          <h4 class="font-bold text-gray-900 text-base truncate">Levantar Denuncia</h4>
          <p class="text-sm text-gray-500 truncate">Toma presencial</p>
        </div>
        <i class="fa-solid fa-chevron-right text-gray-400 text-xl"></i>
      </button>

      <!-- Buzón Offline -->
      <button @click="irA('buzon-offline')"
        class="w-full bg-white rounded-3xl p-5 shadow-lg shadow-gray-200/50 border border-gray-100 flex items-center space-x-4 active:scale-95 transition-all duration-300 hover:shadow-xl">
        <div class="w-14 h-14 shrink-0 bg-orange-100 rounded-2xl flex items-center justify-center">
          <i class="fa-solid fa-wifi text-orange-600 text-2xl"></i>
        </div>
        <div class="flex-1 min-w-0 text-left">
          <h4 class="font-bold text-gray-900 text-base truncate">Buzón Offline</h4>
          <p class="text-sm text-gray-500 truncate">Sincronizar datos</p>
        </div>
        <i class="fa-solid fa-chevron-right text-gray-400 text-xl"></i>
      </button>
    </div>

    <!-- Info Section -->
    <div class="bg-green-50 rounded-2xl p-4 border border-green-100">
      <div class="flex items-start space-x-3">
        <div class="w-8 h-8 bg-green-500 rounded-full flex items-center justify-center flex-shrink-0">
          <i class="fa-solid fa-info text-white text-sm"></i>
        </div>
        <div>
          <h4 class="font-semibold text-gray-900 text-sm">Información</h4>
          <p class="text-xs text-gray-600 mt-1">Tu zona asignada es {{ zonaAsignada }}. Todas tus intervenciones serán
            georreferenciadas en esta área.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Tab Bar Reutilizable -->
  <bottom-tab-bar tipo="empleado"></bottom-tab-bar>
</div>

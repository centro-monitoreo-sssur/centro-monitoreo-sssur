<!-- ============================================================
     VISTA: Mi Perfil (Empleado)
     Centro de Monitoreo SSSur · PWA de campo
     ============================================================ -->
<!-- `overflow-x-hidden` en la raíz: un correo institucional largo sin espacios
     desborda la tarjeta y mete TODA la página en scroll horizontal, lo que a su
     vez corta la barra de navegación inferior. -->
<div class="min-h-screen bg-gray-50 overflow-x-hidden pb-[calc(env(safe-area-inset-bottom)+7.5rem)]">

  <!-- Header -->
  <div class="bg-white/80 backdrop-blur-lg border-b border-gray-200/50 sticky top-0 z-40">
    <div class="px-4 py-3 flex items-center gap-3 pt-safe">
      <button @click="irA('pwa-empleado')"
        class="toque-comodo w-10 h-10 bg-gray-100 hover:bg-gray-200 rounded-full flex items-center justify-center transition-colors active:scale-95"
        aria-label="Volver">
        <i aria-hidden="true" class="fa-solid fa-arrow-left text-gray-600"></i>
      </button>
      <div class="min-w-0">
        <h1 class="text-lg font-bold text-gray-900">Mi Perfil</h1>
        <p class="text-xs text-gray-500 font-medium">Datos de tu cuenta</p>
      </div>
    </div>
  </div>

  <!-- Cargando -->
  <div v-if="cargando" class="flex flex-col items-center justify-center py-24">
    <i class="fa-solid fa-circle-notch fa-spin text-emerald-500 text-4xl mb-4"></i>
    <p class="text-gray-500 font-medium">Cargando tu perfil…</p>
  </div>

  <!-- Error de carga. Con reintento: en territorio, lo más probable es que
       simplemente no hubiera señal en ese momento. -->
  <div v-else-if="error" class="px-5 py-10">
    <div class="bg-white rounded-3xl border border-red-100 shadow-sm p-6 text-center">
      <i class="fa-solid fa-triangle-exclamation text-red-500 text-3xl mb-3"></i>
      <p class="text-sm text-gray-700 font-medium">{{ error }}</p>
      <button @click="cargarPerfil"
        class="toque-comodo mt-4 px-5 py-2.5 rounded-2xl bg-emerald-600 text-white text-sm font-bold active:scale-95 transition-transform">
        Reintentar
      </button>
    </div>
  </div>

  <template v-else-if="perfil">
    <div class="px-5 py-6 space-y-5">

      <!-- ── Identidad ────────────────────────────────────────────────── -->
      <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-6">
        <div class="flex items-center gap-4">
          <!-- Avatar. La foto es lo único visual que el empleado controla. -->
          <div class="relative shrink-0">
            <div class="w-20 h-20 rounded-full overflow-hidden bg-emerald-500 flex items-center justify-center shadow-lg shadow-emerald-500/25">
              <img v-if="perfil.foto_perfil_url" :src="perfil.foto_perfil_url"
                class="w-full h-full object-cover" alt="Fotografía de perfil">
              <span v-else class="text-white text-2xl font-black">{{ iniciales }}</span>
            </div>

            <div v-if="subiendoFoto"
              class="absolute inset-0 rounded-full bg-black/50 flex items-center justify-center">
              <i class="fa-solid fa-circle-notch fa-spin text-white"></i>
            </div>

            <label v-else
              class="toque-comodo absolute -bottom-0.5 -right-0.5 w-8 h-8 rounded-full bg-white border border-gray-200 shadow flex items-center justify-center cursor-pointer active:scale-95 transition-transform"
              aria-label="Cambiar fotografía">
              <i class="fa-solid fa-camera text-gray-600 text-xs"></i>
              <input type="file" class="hidden" accept="image/*" @change="cambiarFoto">
            </label>
          </div>

          <div class="min-w-0 flex-1">
            <h2 class="text-xl font-bold text-gray-900 break-words leading-tight">{{ nombreCompleto }}</h2>
            <p class="text-sm text-gray-500 mt-0.5">Empleado Municipal</p>
            <span v-if="perfil.activo"
              class="inline-flex items-center gap-1 mt-2 text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700">
              <i class="fa-solid fa-circle-check text-[8px]"></i> Cuenta activa
            </span>
          </div>
        </div>
      </div>

      <!-- ── Teléfono · lo único editable junto a la foto ─────────────── -->
      <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-5">
        <div class="flex items-center justify-between gap-3">
          <div class="flex items-center gap-3 min-w-0">
            <div class="w-10 h-10 rounded-2xl bg-emerald-50 flex items-center justify-center shrink-0">
              <i class="fa-solid fa-phone text-emerald-600"></i>
            </div>
            <div class="min-w-0">
              <p class="text-[11px] font-bold uppercase tracking-wider text-gray-400">Teléfono</p>
              <p class="text-sm font-semibold text-gray-900 break-words"
                :class="{ 'text-gray-400 italic font-normal': !perfil.telefono }">
                {{ telefonoMostrado }}
              </p>
            </div>
          </div>
          <button @click="abrirEdicion"
            class="toque-comodo shrink-0 px-4 py-2 rounded-xl bg-emerald-600 text-white text-xs font-bold active:scale-95 transition-transform">
            <i class="fa-solid fa-pen mr-1"></i> Editar
          </button>
        </div>
      </div>

      <!-- ── Datos institucionales · solo lectura ─────────────────────── -->
      <div class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="px-5 pt-5 pb-3">
          <h3 class="text-xs font-bold uppercase tracking-wider text-gray-400">Datos institucionales</h3>
        </div>

        <div class="divide-y divide-gray-50">
          <div v-for="campo in datosInstitucionales" :key="campo.etiqueta"
            class="px-5 py-3.5 flex items-start gap-3">
            <i :class="['fa-solid', campo.icono]" class="text-gray-300 text-sm mt-0.5 w-4 text-center shrink-0"></i>
            <div class="min-w-0 flex-1">
              <p class="text-[11px] font-semibold text-gray-400">{{ campo.etiqueta }}</p>
              <!-- `break-words` obligatorio: un correo institucional largo no
                   tiene espacios donde cortar y desbordaría la tarjeta. -->
              <p class="text-sm text-gray-800 break-words"
                :class="{ 'text-gray-400 italic': campo.valor === 'No registrado' }">
                {{ campo.valor }}
              </p>
            </div>
          </div>
        </div>

        <!-- Por qué no se pueden editar aquí. Sin esta explicación, el empleado
             busca un botón que no existe y acaba llamando a soporte. -->
        <div class="mx-5 mb-5 mt-3 rounded-2xl bg-gray-50 border border-gray-100 px-4 py-3 flex items-start gap-2.5">
          <i class="fa-solid fa-lock text-gray-400 text-xs mt-0.5"></i>
          <p class="text-[11px] text-gray-600 leading-snug">
            Tu <strong class="font-semibold">cargo</strong>,
            <strong class="font-semibold">departamento</strong> y
            <strong class="font-semibold">correo institucional</strong> los administra la
            Gerencia de Tecnología. Si alguno está mal o cambió, solicítalo y lo
            actualizan desde el panel.
          </p>
        </div>
      </div>

    </div>
  </template>

  <!-- ── Aviso flotante ──────────────────────────────────────────────── -->
  <div v-if="aviso" class="fixed bottom-28 left-0 right-0 z-50 px-5 pointer-events-none">
    <div class="rounded-2xl bg-gray-900/90 backdrop-blur text-white px-4 py-3 text-sm font-medium shadow-xl flex items-center gap-2">
      <i class="fa-solid fa-circle-info shrink-0"></i>
      <span class="break-words">{{ aviso }}</span>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════════════════════════
       MODAL · editar teléfono
       ══════════════════════════════════════════════════════════════════ -->
  <div v-if="modalEditar" class="fixed inset-0 z-[100] flex items-end sm:items-center justify-center bg-black/50 backdrop-blur-sm"
    @click.self="cerrarEdicion">
    <!-- Anclado abajo en móvil: queda al alcance del pulgar, que es como se
         comportan los diálogos de una app nativa. -->
    <div class="bg-white w-full sm:max-w-sm rounded-t-3xl sm:rounded-3xl shadow-2xl p-6 pb-[calc(env(safe-area-inset-bottom)+1.5rem)]">
      <div class="w-10 h-1 bg-gray-200 rounded-full mx-auto mb-5 sm:hidden"></div>

      <h3 class="text-base font-bold text-gray-900 mb-1">Editar teléfono</h3>
      <p class="text-xs text-gray-500 mb-4">Es el número por el que te contactará el Centro de Monitoreo.</p>

      <input v-model="telefonoEditado" type="tel" inputmode="tel" maxlength="20"
        placeholder="7712-3456"
        class="w-full bg-gray-50 border border-gray-200 rounded-2xl px-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent">

      <p v-if="errorEdicion" class="mt-2 text-[11px] text-red-600 font-semibold">{{ errorEdicion }}</p>

      <div class="flex gap-2 mt-5">
        <button @click="cerrarEdicion" :disabled="guardando"
          class="toque-comodo flex-1 py-3 rounded-2xl bg-gray-100 text-gray-700 text-sm font-bold active:scale-95 transition-transform disabled:opacity-50">
          Cancelar
        </button>
        <button @click="guardarTelefono" :disabled="guardando"
          class="toque-comodo flex-1 py-3 rounded-2xl bg-emerald-600 text-white text-sm font-bold active:scale-95 transition-transform disabled:opacity-50">
          <i v-if="guardando" class="fa-solid fa-circle-notch fa-spin mr-1"></i>
          {{ guardando ? 'Guardando…' : 'Guardar' }}
        </button>
      </div>
    </div>
  </div>

  <bottom-tab-bar tipo="empleado"></bottom-tab-bar>
</div>

<!-- ============================================================
     VISTA: Mapa en Vivo (Mobile PWA - Empleados)
     Portal de Denuncias Ciudadanas · San Salvador Sur
     ============================================================ -->
<div class="h-screen w-full relative bg-gray-100 flex flex-col overflow-hidden">
  <!-- Header Flotante (Topbar) -->
  <div class="absolute top-0 left-0 right-0 z-20 bg-white/95 backdrop-blur-xl border-b border-gray-200/50 shadow-lg">
    <div class="px-4 py-3 flex items-center justify-between pt-safe">
      <div class="flex items-center space-x-3">
        <!-- Sin botón de atrás, es una tab principal -->
        <div class="w-10 h-10 bg-emerald-100 rounded-full flex items-center justify-center">
          <i class="fa-solid fa-map-location-dot text-emerald-600"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold text-gray-900">Mapa Operativo</h1>
          <div class="flex items-center gap-1.5 mt-0.5">
            <div class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></div>
            <p class="text-[11px] text-emerald-600 font-bold uppercase tracking-wider">Modo Campo</p>
          </div>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <!-- La ubicación se pide SOLO al pulsar. El botón cambia de estado para
             que se note que el GPS está trabajando: en campo puede tardar
             varios segundos y sin señal visible parece que no responde. -->
        <!-- Tres estados con un solo botón: sin ubicación → puntual → seguir.
             Se pide el GPS solo al pulsar, nunca al abrir la vista. -->
        <button @click="ubicacionActiva ? alternarSeguimiento() : obtenerUbicacion()"
                :disabled="cargandoUbicacion"
                :aria-label="cargandoUbicacion ? 'Obteniendo tu ubicación'
                  : siguiendo ? 'Dejar de seguir mi ubicación'
                  : ubicacionActiva ? 'Seguir mi ubicación mientras me muevo' : 'Ir a mi ubicación'"
                :aria-pressed="siguiendo ? 'true' : 'false'"
                :aria-busy="cargandoUbicacion ? 'true' : 'false'"
                class="relative w-11 h-11 rounded-full flex items-center justify-center transition-colors active:scale-95 disabled:opacity-70"
                :class="siguiendo ? 'bg-emerald-500 text-white shadow-lg shadow-emerald-500/30'
                  : ubicacionActiva ? 'bg-emerald-100 text-emerald-600'
                  : 'bg-gray-100 hover:bg-gray-200 text-gray-600'">
          <i class="fa-solid"
             :class="cargandoUbicacion ? 'fa-circle-notch fa-spin'
               : siguiendo ? 'fa-location-arrow' : 'fa-location-crosshairs'" aria-hidden="true"></i>
          <span v-if="siguiendo" class="absolute -bottom-0.5 -right-0.5 w-3 h-3 rounded-full bg-white flex items-center justify-center">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
          </span>
        </button>
        <button @click="mostrarMenuCapas = !mostrarMenuCapas"
                aria-label="Capas del mapa"
                :aria-expanded="mostrarMenuCapas ? 'true' : 'false'"
                class="toque-comodo w-11 h-11 rounded-full flex items-center justify-center bg-gray-100 hover:bg-gray-200 transition-colors text-gray-600 active:scale-95">
          <i class="fa-solid fa-layer-group" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Contenedor del Mapa -->
  <div id="map-vivo-mobile" class="absolute inset-0 z-0 w-full h-full"></div>

  <!-- Aviso de GPS. Un fallo de ubicación tiene que decirse: antes el mapa
       simplemente saltaba a las coordenadas por defecto y no había forma de
       saber si el GPS había fallado o si esa era tu posición. -->
  <div v-if="errorUbicacion" role="alert"
       class="absolute top-20 left-4 right-4 z-30 flex items-start gap-3 rounded-2xl bg-white/95 backdrop-blur-xl border border-amber-200 shadow-lg px-4 py-3">
    <i class="fa-solid fa-location-dot text-amber-500 mt-0.5 shrink-0" aria-hidden="true"></i>
    <p class="flex-1 min-w-0 text-xs text-gray-700 break-words">{{ errorUbicacion }}</p>
    <button @click="limpiarErrorUbicacion" aria-label="Descartar aviso"
            class="toque-comodo shrink-0 w-6 h-6 rounded-full text-gray-400 hover:bg-gray-100 flex items-center justify-center">
      <i class="fa-solid fa-xmark text-xs" aria-hidden="true"></i>
    </button>
  </div>

  <!-- Precisión: una posición con ±200 m no sirve para ubicar un bache, y sin
       este dato el empleado no puede saberlo. -->
  <div v-else-if="ubicacionActiva && precisionUbicacion"
       class="absolute bottom-32 left-1/2 -translate-x-1/2 z-30 px-3 py-1.5 rounded-full bg-white/90 backdrop-blur border border-gray-200 shadow text-[11px] text-gray-600 font-mono whitespace-nowrap">
    Precisión ±{{ precisionUbicacion }} m
  </div>

  <!-- Menu de Capas -->
  <div v-if="mostrarMenuCapas" class="absolute top-20 left-4 right-4 bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl shadow-gray-900/20 p-5 z-30 border border-gray-100/50">
    <h3 class="font-bold text-gray-900 mb-4 text-base">Tipo de Mapa</h3>
    <div class="grid grid-cols-3 gap-3">
      <button 
        @click="cambiarTile('cartomap'); mostrarMenuCapas = false"
        class="py-4 px-4 rounded-2xl text-sm font-semibold transition-all duration-300 hover:scale-105 active:scale-95"
        :class="estiloTile === 'cartomap' ? 'bg-gradient-to-br from-emerald-500 to-emerald-600 text-white shadow-lg shadow-emerald-500/30' : 'bg-gray-50 text-gray-700 hover:bg-gray-100 border border-gray-200'">
        <i class="fa-solid fa-sun mb-2 text-2xl block"></i>
        Claro
      </button>
      <button 
        @click="cambiarTile('google'); mostrarMenuCapas = false"
        class="py-4 px-4 rounded-2xl text-sm font-semibold transition-all duration-300 hover:scale-105 active:scale-95"
        :class="estiloTile === 'google' ? 'bg-gradient-to-br from-emerald-500 to-emerald-600 text-white shadow-lg shadow-emerald-500/30' : 'bg-gray-50 text-gray-700 hover:bg-gray-100 border border-gray-200'">
        <i class="fa-solid fa-map-location-dot mb-2 text-2xl block"></i>
        Maps
      </button>
      <button 
        @click="cambiarTile('satellite'); mostrarMenuCapas = false"
        class="py-4 px-4 rounded-2xl text-sm font-semibold transition-all duration-300 hover:scale-105 active:scale-95"
        :class="estiloTile === 'satellite' ? 'bg-gradient-to-br from-emerald-500 to-emerald-600 text-white shadow-lg shadow-emerald-500/30' : 'bg-gray-50 text-gray-700 hover:bg-gray-100 border border-gray-200'">
        <i class="fa-solid fa-earth-americas mb-2 text-2xl block"></i>
        Satélite
      </button>
    </div>
  </div>

  <!-- Panel Inferior de Información Flotante (adaptado sobre el pill tab bar) -->
  <div class="absolute bottom-0 left-0 w-full z-[1000] px-4 pointer-events-none pb-[calc(env(safe-area-inset-bottom)+88px)]">
    <div class="bg-white/95 backdrop-blur-xl rounded-3xl shadow-xl border border-gray-100 p-4 pointer-events-auto flex items-center justify-between mx-auto max-w-sm mb-2 transition-all">
      <div class="flex items-center space-x-4">
        <div class="w-12 h-12 bg-emerald-100 rounded-2xl flex items-center justify-center shrink-0">
          <i class="fa-solid fa-hard-hat text-emerald-600 text-xl"></i>
        </div>
        <div class="min-w-0">
          <h3 class="font-bold text-gray-900 text-[13px] leading-tight line-clamp-1">Incidencias Activas</h3>
          <p class="text-[11px] text-gray-500 font-medium mt-0.5 leading-tight">Zonas de riesgo y atención</p>
        </div>
      </div>
      <button @click="irA('levantar-denuncia')" class="bg-emerald-600 text-white rounded-xl px-4 py-2 text-sm font-bold shadow-md shadow-emerald-500/30 active:scale-95 transition-transform shrink-0 ml-2">
        Reportar
      </button>
    </div>
  </div>

  <!-- Bottom Tab Bar -->
  <bottom-tab-bar tipo="empleado"></bottom-tab-bar>
</div>

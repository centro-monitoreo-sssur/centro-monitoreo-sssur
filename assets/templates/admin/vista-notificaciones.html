<!-- ======================= VISTA: NOTIFICACIONES ======================= -->
<div class="h-full min-h-0 flex flex-col max-w-4xl mx-auto">

  <div class="flex items-center justify-between mb-6">
    <div>
      <h2 class="text-2xl font-bold text-gray-900 dark:text-white">Notificaciones</h2>
      <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Centro de Monitoreo SSSur</p>
    </div>
    <button @click="marcarTodas" class="text-sm font-semibold text-blue-600 dark:text-blue-400 hover:underline">
      Marcar todas como leídas
    </button>
  </div>

  <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 overflow-hidden flex-1 min-h-0 flex flex-col">
    
    <div class="overflow-y-auto custom-scrollbar flex-1 p-2">
      <div v-if="notificaciones.length === 0" class="h-full flex flex-col items-center justify-center text-center p-8">
        <div class="w-16 h-16 bg-gray-50 dark:bg-gray-700/50 rounded-full flex items-center justify-center mb-4">
          <i class="fa-solid fa-bell-slash text-2xl text-gray-400"></i>
        </div>
        <h3 class="text-lg font-bold text-gray-800 dark:text-white mb-1">No tienes notificaciones</h3>
        <p class="text-sm text-gray-500 dark:text-gray-400">Te avisaremos cuando haya algo nuevo.</p>
      </div>

      <div v-else class="flex flex-col gap-2">
        <div v-for="notif in notificaciones" :key="notif.id" 
             @click="marcarLeida(notif.id)"
             class="p-4 rounded-xl transition-all cursor-pointer border flex items-start gap-4"
             :class="notif.leida ? 'bg-white dark:bg-gray-800 border-transparent' : 'bg-blue-50/50 dark:bg-blue-900/10 border-blue-100 dark:border-blue-900/30 shadow-sm'">
          
          <div class="w-10 h-10 rounded-full flex items-center justify-center shrink-0"
               :class="{
                 'bg-indigo-100 text-indigo-600 dark:bg-indigo-900/50 dark:text-indigo-400': notif.tipo === 'sistema',
                 'bg-emerald-100 text-emerald-600 dark:bg-emerald-900/50 dark:text-emerald-400': notif.tipo === 'denuncia',
                 'bg-amber-100 text-amber-600 dark:bg-amber-900/50 dark:text-amber-400': notif.tipo === 'alerta'
               }">
            <i class="fa-solid" :class="{
              'fa-gear': notif.tipo === 'sistema',
              'fa-file-signature': notif.tipo === 'denuncia',
              'fa-triangle-exclamation': notif.tipo === 'alerta'
            }"></i>
          </div>

          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between gap-2 mb-1">
              <h4 class="text-sm font-bold truncate transition-colors"
                  :class="notif.leida ? 'text-gray-700 dark:text-gray-300' : 'text-gray-900 dark:text-white'">
                {{ notif.titulo }}
              </h4>
              <span class="text-xs whitespace-nowrap"
                    :class="notif.leida ? 'text-gray-400' : 'text-blue-600 dark:text-blue-400 font-semibold'">
                {{ notif.fecha }}
              </span>
            </div>
            <p class="text-sm line-clamp-2"
               :class="notif.leida ? 'text-gray-500 dark:text-gray-400' : 'text-gray-700 dark:text-gray-300'">
              {{ notif.mensaje }}
            </p>
          </div>
          
          <div class="w-2.5 h-2.5 rounded-full shrink-0 mt-2" 
               :class="notif.leida ? 'bg-transparent' : 'bg-blue-600'">
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

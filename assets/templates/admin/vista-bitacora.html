<!-- ======================= VISTA: BITÁCORA DE AUDITORÍA ======================= -->
<ui-contenedor-pagina>
<ui-cabecera-pagina titulo="Bitácora de Auditoría"
                    subtitulo="Registro inmutable de eventos y acciones en el sistema">
  <template #acciones>
  <!-- Ambos botones estaban sin @click desde el primer día. Se marcan como
       deshabilitados hasta que exista la exportación real. -->
  <div class="flex gap-2">
    <button disabled title="Pendiente de implementar"
            class="px-4 py-2 bg-gray-100 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl text-sm font-semibold text-gray-400 dark:text-gray-500 cursor-not-allowed">
      <i class="fa-solid fa-print mr-2"></i> Imprimir Reporte
    </button>
    <button disabled title="Pendiente de implementar"
            class="px-4 py-2 bg-gray-100 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl text-sm font-semibold text-gray-400 dark:text-gray-500 cursor-not-allowed">
      <i class="fa-solid fa-file-csv mr-2"></i> Exportar CSV
    </button>
  </div>
  </template>
</ui-cabecera-pagina>

<!-- FILTROS -->
<ui-barra-filtros>
  <div class="w-full sm:w-72">
    <ui-campo-busqueda v-model="busqueda" marcador="Usuario, módulo, detalle…" tamano="compacto"
                       etiqueta-accesible="Buscar en la bitácora"></ui-campo-busqueda>
  </div>
  <div class="w-full sm:w-52">
    <ui-select v-model="filtroAccion" :opciones="accionesUnicas"
               texto-vacio="Todas las acciones" valor-vacio="todas"></ui-select>
  </div>
  <template #derecha>
    <span class="text-theme-xs text-gray-500 dark:text-gray-400">
      {{ logsFiltrados.length }} registro(s)
    </span>
  </template>
</ui-barra-filtros>

<!-- Nota de inmutabilidad, fuera de la tabla para que sobreviva al modo tarjetas. -->
<div class="mb-4 flex shrink-0 items-start gap-2 rounded-xl border border-blue-200 bg-blue-50/60 px-4 py-2.5 text-xs text-blue-700 dark:border-blue-900/50 dark:bg-blue-900/10 dark:text-blue-400">
  <i class="fa-solid fa-lock mt-0.5 text-brand-500" aria-hidden="true"></i>
  <span><strong>Nota de seguridad:</strong> los registros de esta bitácora son inmutables: ningún usuario puede modificarlos ni eliminarlos.</span>
</div>

<!-- Registros: tabla desde lg, tarjetas en teléfono. La paginación por cursor
     sobre `bitacora_auditoria.id` sigue pendiente; hasta entonces no se pintan
     botones que no navegan (OFFSET prohibido por CONTEXTO_CRITICO.md §2.2). -->
<ui-tabla
  :columnas="COLUMNAS_TABLA"
  :filas="logsFiltrados"
  :cargando="cargando"
  densidad="compacta"
  ancho-minimo="900px"
  vacio-icono="fa-solid fa-shield-halved"
  vacio-texto="No hay registros de auditoría que coincidan con la búsqueda"
  class="flex-1">

  <template #celda-id="{ valor }">
    <span class="font-mono font-semibold text-gray-500">{{ valor }}</span>
  </template>
  <template #celda-fecha="{ valor }">
    <span class="font-mono text-[11px] text-gray-600 dark:text-gray-300">{{ formatearFecha(valor) }}</span>
  </template>
  <template #celda-usuario="{ valor }">
    <span class="text-xs font-semibold text-gray-800 dark:text-gray-200">{{ valor }}</span>
  </template>
  <template #celda-accion="{ valor }">
    <span class="rounded px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider" :class="getAccionBadge(valor)">{{ valor }}</span>
  </template>
  <template #celda-detalle="{ valor }">
    <span class="text-xs text-gray-600 dark:text-gray-400">{{ valor }}</span>
  </template>
  <template #celda-ip="{ valor }">
    <span class="font-mono text-[11px] text-gray-500">{{ valor }}</span>
  </template>

  <template #tarjeta="{ fila }">
    <div class="flex items-center justify-between gap-2">
      <span class="rounded px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider" :class="getAccionBadge(fila.accion)">{{ fila.accion }}</span>
      <span class="font-mono text-[10px] text-gray-400">#{{ fila.id }} · {{ formatearFecha(fila.fecha) }}</span>
    </div>
    <p class="mt-1 text-sm font-semibold text-gray-900 dark:text-white">{{ fila.usuario }}
      <span class="font-normal text-gray-400">· {{ fila.modulo }}</span>
    </p>
    <p class="mt-0.5 text-theme-xs leading-relaxed text-gray-600 dark:text-gray-400">{{ fila.detalle }}</p>
  </template>
</ui-tabla>
</ui-contenedor-pagina><!-- cierra el contenedor raíz: faltaba desde el original y solo no rompía
           porque el compilador de Vue autocierra las etiquetas al final del template -->

<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Centro de Monitoreo Municipal | San Salvador Sur</title>
  
  <!-- PWA & Mobile Install -->
  <link rel="manifest" href="./manifest.json">
  <script>
    // Un manifest POR CONTEXTO. Con uno solo, `start_url: "./"` hacía que un
    // empleado que instalara la PWA de campo la abriera en el Centro de
    // Monitoreo: el acceso directo perdía el `?contexto=empleados` y la app
    // arrancaba en la aplicación equivocada.
    //
    // Va aquí, en línea y justo detrás del <link>, porque el navegador lee el
    // manifiesto muy pronto —antes de que se evalúe ningún módulo ES— para
    // decidir si ofrece instalar.
    (function () {
      var contexto = new URLSearchParams(location.search).get('contexto');
      var instalables = { empleados: 1, poblacion: 1 };
      if (contexto && instalables[contexto]) {
        var etiqueta = document.querySelector('link[rel="manifest"]');
        if (etiqueta) etiqueta.href = './manifest-' + contexto + '.json';
      }
    })();
  </script>
  <meta name="theme-color" content="#001ba0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CM SSSur">
  <link rel="apple-touch-icon" href="https://sansalvadorsur.gob.sv/images/logo-circulo-blanco.png">

  <link rel="icon" type="image/png" href="https://sansalvadorsur.gob.sv/images/logo-circulo-blanco.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // ============================================================
    // ESCALA DE DISEÑO (Fase 0)
    // Tailwind por CDN sí admite extender el tema: basta declararlo antes de
    // que se use ninguna clase. Sin esto, la identidad municipal solo existía
    // como variables CSS en tokens.css —invisibles para las utilidades— y cada
    // plantilla terminaba escribiendo `bg-blue-600`, que no es el azul de la
    // alcaldía.
    //
    // Las variables de tokens.css NO se sustituyen: siguen siendo la fuente de
    // la paleta operativa configurable por el administrador. Esto es la capa
    // estática (identidad + superficies), que no cambia en tiempo de ejecución.
    // ============================================================
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            // Azul institucional San Salvador Sur. El 600 es el color oficial;
            // el resto es la escala derivada para estados y fondos tenues.
            brand: {
              50:  '#eef2ff', 100: '#dde4ff', 200: '#bcc9ff', 300: '#93a5fb',
              400: '#6076ef', 500: '#3048d2', 600: '#001ba0', 700: '#001785',
              800: '#00126a', 900: '#0d1a5c', 950: '#0a1240',
            },
            // Acento institucional (Protección Civil).
            gold: {
              50: '#fffbeb', 100: '#fff3c4', 200: '#ffe680', 300: '#ffd94d',
              400: '#ffcc00', 500: '#e6b800', 600: '#b38f00', 700: '#806600',
            },
            gray: {
              // Tailwind no trae el 750 y cuatro plantillas ya lo usaban en
              // `dark:hover:bg-gray-750`: la clase no existía, así que el hover
              // en modo oscuro simplemente no ocurría. Se define en lugar de
              // borrar los usos, porque el escalón intermedio hace falta de
              // verdad entre el 700 (#374151) y el 800 (#1f2937).
              750: '#2a323f',
            },
          },
          boxShadow: {
            // Sombras suaves de tarjeta. Sustituyen al `shadow-sm` genérico,
            // que en modo oscuro desaparece por completo.
            card:       '0 1px 3px 0 rgb(16 24 40 / 0.08), 0 1px 2px -1px rgb(16 24 40 / 0.06)',
            'card-hover':'0 8px 24px -4px rgb(16 24 40 / 0.12), 0 2px 6px -2px rgb(16 24 40 / 0.07)',
            popover:    '0 12px 32px -8px rgb(16 24 40 / 0.20)',
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
          },
          fontSize: {
            // Escala de títulos: evita que cada vista invente su propio tamaño.
            'title-sm': ['1.125rem', { lineHeight: '1.6rem',  fontWeight: '600' }],
            'title-md': ['1.5rem',   { lineHeight: '2rem',    fontWeight: '700' }],
            'title-lg': ['1.875rem', { lineHeight: '2.375rem',fontWeight: '700' }],
          },
        },
      },
    }
  </script>
  <!-- Anti-FOUC para Dark Mode -->
  <script>
    if (localStorage.getItem('color-theme') === 'dark') {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://unpkg.com/vue@3.4.21/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/vue-virtual-scroller@2.0.0-beta.8/dist/vue-virtual-scroller.min.js"></script>
  <!-- Supabase SDK. Se cargaba dos veces (el paquete y su bundle UMD); el
       segundo pisaba al primero, así que era una descarga tirada. Se conserva
       el UMD, que es el que define `window.supabase`. -->
  <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
  <script src="assets/js/services/geo-json/limites-municipio.js"></script>
  <script src="assets/js/services/geo-json/limites-poligonos.js"></script>
  <script src="assets/js/utils/validacion-limites.js"></script>

  <!-- PLUGINS LEAFLET -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet-measure/dist/leaflet-measure.css" />
  <script src="https://unpkg.com/leaflet-measure/dist/leaflet-measure.js"></script>

  <!-- ============================================================
     ESTILOS MODULARES (orden de cascada: tokens → base → componentes)
     ============================================================ -->
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/skeleton.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/mapa.css">
</head>

<body>
  <!-- El shell completo se renderiza por Vue a partir de las plantillas
     modulares en assets/templates/. app.js carga todo y monta aquí. -->
  <div id="app" v-cloak></div>

  <!-- Los GeoJSON del municipio y de los distritos ya se cargan en el <head>,
       antes de validacion-limites.js, que es quien los consume. Aquí estaban
       repetidos: ~290 KB descargados dos veces en cada arranque, que en un
       teléfono con datos móviles en territorio no es un detalle. -->
  <!-- Bootstrap de la aplicación (módulos ES). Debe servirse por HTTP. -->
  <script type="module" src="assets/js/app.js"></script>
</body>

</html>

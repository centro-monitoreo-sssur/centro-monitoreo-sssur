<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Centro de Monitoreo Municipal | San Salvador Sur</title>
  <link rel="icon" type="image/png" href="https://sansalvadorsur.gob.sv/images/logo-circulo-blanco.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <!-- Anti-FOUC para Dark Mode -->
  <script>
    if (localStorage.getItem('color-theme') === 'dark') {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://unpkg.com/vue@3.4.21/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/vue-virtual-scroller@2.0.0-beta.8/dist/vue-virtual-scroller.min.js"></script>
  <!-- Supabase SDK -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
  <script src="assets/js/services/geo-json/limites-municipio.js"></script>
  <script src="assets/js/services/geo-json/limites-poligonos.js"></script>
  <script src="assets/js/utils/validacion-limites.js"></script>

  <!-- PLUGINS LEAFLET -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet-measure/dist/leaflet-measure.css" />
  <script src="https://unpkg.com/leaflet-measure/dist/leaflet-measure.js"></script>

  <!-- ============================================================
     ESTILOS MODULARES (orden de cascada: tokens → base → componentes)
     ============================================================ -->
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/skeleton.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/mapa.css">
</head>

<body>
  <!-- El shell completo se renderiza por Vue a partir de las plantillas
     modulares en assets/templates/. app.js carga todo y monta aquí. -->
  <div id="app" v-cloak></div>

  <!-- GeoJSON del municipio (expuesto como función global) -->
  <script src="assets/js/services/geo-json/limites-municipio.js"></script>
  <!-- GeoJSON de distritos municipales (Panchimalco, Rosario de Mora, etc.) -->
  <script src="assets/js/services/geo-json/limites-poligonos.js"></script>
  <!-- Bootstrap de la aplicación (módulos ES). Debe servirse por HTTP. -->
  <script type="module" src="assets/js/app.js"></script>
</body>

</html>

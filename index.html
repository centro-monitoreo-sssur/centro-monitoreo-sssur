<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Centro de Monitoreo Municipal | San Salvador Sur</title>
  
  <!-- PWA & Mobile Install -->
  <link rel="manifest" href="/manifest.json">
  <script>
    (function () {
      var porRuta = { campo: 'empleados', ciudadano: 'poblacion' };
      var primerTramo = location.pathname.split('/')[1];
      var manifiesto = porRuta[primerTramo];
      if (manifiesto) {
        var etiqueta = document.querySelector('link[rel="manifest"]');
        if (etiqueta) etiqueta.href = '/manifest-' + manifiesto + '.json';
      }
    })();
  </script>
  <meta name="theme-color" content="#001ba0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CM SSSur">
  <link rel="apple-touch-icon" href="https://sansalvadorsur.gob.sv/images/logo-circulo-blanco.png">

  <link rel="icon" type="image/png" href="https://sansalvadorsur.gob.sv/images/logo-circulo-blanco.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50:  '#eef2ff', 100: '#dde4ff', 200: '#bcc9ff', 300: '#93a5fb',
              400: '#6076ef', 500: '#3048d2', 600: '#001ba0', 700: '#001785',
              800: '#00126a', 900: '#0d1a5c', 950: '#0a1240',
            },
            gold: {
              50: '#fffbeb', 100: '#fff3c4', 200: '#ffe680', 300: '#ffd94d',
              400: '#ffcc00', 500: '#e6b800', 600: '#b38f00', 700: '#806600',
            },
            gray: {
              750: '#2a323f',
            },
          },
          boxShadow: {
            card:       '0 1px 3px 0 rgb(16 24 40 / 0.08), 0 1px 2px -1px rgb(16 24 40 / 0.06)',
            'card-hover':'0 8px 24px -4px rgb(16 24 40 / 0.12), 0 2px 6px -2px rgb(16 24 40 / 0.07)',
            popover:    '0 12px 32px -8px rgb(16 24 40 / 0.20)',
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
          },
          fontSize: {
            'title-sm': ['1.125rem', { lineHeight: '1.6rem',  fontWeight: '600' }],
            'title-md': ['1.5rem',   { lineHeight: '2rem',    fontWeight: '700' }],
            'title-lg': ['1.875rem', { lineHeight: '2.375rem',fontWeight: '700' }],
          },
        },
      },
    }
  </script>
  <script>
    if (localStorage.getItem('color-theme') === 'dark') {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>

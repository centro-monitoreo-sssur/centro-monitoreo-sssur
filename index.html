<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Centro de Monitoreo Municipal | San Salvador Sur</title>
  
  <!-- PWA & Mobile Install -->
  <link rel="manifest" href="/manifest.json">
  <script>
    (function () {
      var porRuta = { campo: 'empleados', ciudadano: 'poblacion' };
      var primerTramo = location.pathname.split('/')[1];
      var manifiesto = porRuta[primerTramo];
      if (manifiesto) {
        var etiqueta = document.querySelector('link[rel="manifest"]');
        if (etiqueta) etiqueta.href = '/manifest-' + manifiesto + '.json';
      }
    })();
  </script>
  <meta name="theme-color" content="#001ba0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CM SSSur">
  <link rel="apple-touch-icon" href="/assets/img/marca/icono-192.png">

  <link rel="icon" type="image/png" href="/assets/img/marca/favicon-32.png">

  <script>
    if (localStorage.getItem('color-theme') === 'dark') {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
  <!-- ============================================================
     DEPENDENCIAS · TODAS LOCALES
     ------------------------------------------------------------
     Nada de CDN. Los quince recursos que se cargaban de unpkg, cdnjs y
     Google Fonts viven ahora en /assets/vendor/, descargados con la versión
     fijada por "node herramientas/vendorizar.mjs".

     Es lo que permite que la PWA de campo funcione sin señal: el service
     worker no puede precachear lo que no controla, y sin Vue no hay
     aplicación — una cuadrilla sin cobertura abría una pantalla en blanco.
     De paso quita a cuatro terceros que sabían qué IP entra al panel
     municipal y cuándo, y fija versiones que antes flotaban: "supabase-js@2"
     servía lo último de la rama, así que un cambio de comportamiento podía
     llegar solo, un martes, sin que nadie tocara el código.
     ============================================================ -->
  <link rel="stylesheet" href="/assets/vendor/fuentes/fuentes.css">
  <link rel="stylesheet" href="/assets/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="/assets/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/assets/vendor/leaflet-markercluster/MarkerCluster.css">
  <link rel="stylesheet" href="/assets/vendor/leaflet-markercluster/MarkerCluster.Default.css">
  <link rel="stylesheet" href="/assets/vendor/leaflet-measure/leaflet-measure.css">

  <script src="/assets/vendor/leaflet/leaflet.js"></script>
  <script src="/assets/vendor/leaflet-markercluster/leaflet.markercluster.js"></script>
  <script src="/assets/vendor/leaflet-heat/leaflet-heat.js"></script>
  <script src="/assets/vendor/leaflet-measure/leaflet-measure.js"></script>
  <script src="/assets/vendor/chartjs/chart.umd.min.js"></script>
  <script src="/assets/vendor/vue/vue.global.prod.js"></script>
  <script src="/assets/vendor/vue-virtual-scroller/vue-virtual-scroller.min.js"></script>
  <script src="/assets/vendor/supabase/supabase.js"></script>
  <script src="/assets/vendor/turf/turf.min.js"></script>

  <script src="/assets/js/services/geo-json/limites-municipio.js"></script>
  <script src="/assets/js/services/geo-json/limites-poligonos.js"></script>
  <script src="/assets/js/utils/validacion-limites.js"></script>
  <!-- ============================================================
     ESTILOS MODULARES (orden de cascada: tokens → base → componentes)
     ============================================================ -->
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/pwa-oscuro.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/skeleton.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/mapa.css">

  <!-- ============================================================
     TAILWIND · AL FINAL, Y NO ES CAPRICHO
     ------------------------------------------------------------
     La CDN inyectaba su <style> en tiempo de ejecución, y ese nodo acababa
     DESPUÉS de todos los <link> de arriba. O sea: durante todo el proyecto,
     Tailwind ha ganado los empates de especificidad frente a las hojas
     propias, y estas se escribieron sabiéndolo —de ahí los `!important`
     puntuales de mapa.css—.

     Ponerlo primero, que es lo natural al vendorizar, invertía esa regla en
     cada empate del sistema entero. Aquí se conserva el orden real que tenía.

     Lo compila `npm run css` desde tailwind.config.js. No se edita a mano: lo
     que se escriba en el archivo se pierde en la siguiente compilación.
     ============================================================ -->
  <link rel="stylesheet" href="/assets/css/tailwind.css">
</head>

<body>
  <div id="app" v-cloak></div>
  <script type="module" src="/assets/js/app.js"></script>
</body>

</html>
